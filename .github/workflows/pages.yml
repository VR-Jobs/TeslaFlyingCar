name: Build and deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check original core and star-ring rules
        run: |
          npm run check
          npm run check:orbit
          node tools/check-orbit-fx.mjs
          npm run check:handling
          npm run check:space
          node tools/check-star-ring-structures.mjs
          node tools/check-planets.mjs
          npm run check:gravity-flip
          npm run check:star-ring-rainbow
          npm run check:experience
          npm run check:placement
      - name: Build offline and online versions
        run: |
          npm run build:html
          npm run check:html
          npm run build:online
          npm run check:online
          cp LICENSE LICENSE-SCOPE.md public/third-party-notices.txt dist-online/
          touch dist-online/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-online
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
