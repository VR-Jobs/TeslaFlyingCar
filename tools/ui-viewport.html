<!doctype html><html lang="zh"><meta charset="utf-8"><title>星环界面验收</title>
<style>body{margin:0;background:#181818;color:#eee;font:13px system-ui}nav{padding:10px;display:flex;gap:12px;align-items:center}button,select{padding:6px}#frame-box{position:relative;margin:10px auto}iframe{border:1px solid #555;transform-origin:top left}output{white-space:pre-wrap}</style>
<nav><label>屏幕 <select id="size"><option value="1280,720">桌面 1280 × 720</option><option value="390,844">手机 390 × 844</option><option value="844,390">横屏 844 × 390</option></select></label>
<label>界面 <select id="fixture"><option value="check">全部回归</option><option value="clear">通关</option><option value="endless">无限结算</option><option value="dead">失败</option><option value="pause">暂停</option><option value="rainbow">彩虹气量</option></select></label><button id="load">显示界面</button><span id="result">准备中</span></nav>
<div id="frame-box"><iframe title="游戏界面"></iframe></div><output id="report"></output>
<script>
const frame=document.querySelector('iframe'),box=document.querySelector('#frame-box');let poll;
function load(){clearInterval(poll);const[w,h]=document.querySelector('#size').value.split(',').map(Number),scale=Math.min(1,(innerWidth-24)/w,(innerHeight-75)/h);frame.width=w;frame.height=h;frame.style.transform=`scale(${scale})`;box.style.width=w*scale+'px';box.style.height=h*scale+'px';document.querySelector('#result').textContent='加载中';frame.src='/?starRingQA=1&ringSeed=11&uiFixture='+document.querySelector('#fixture').value;poll=setInterval(()=>{const report=frame.contentDocument?.querySelector('#star-ring-qa-report')?.dataset.report;if(report){clearInterval(poll);const data=JSON.parse(report);document.querySelector('#result').textContent=data.checks.filter(c=>c.pass).length+' / '+data.checks.length;document.querySelector('#report').textContent=report;}else if(frame.contentDocument?.querySelector('#star-ring-qa')?.style.display==='none'){clearInterval(poll);document.querySelector('#result').textContent='已显示';document.querySelector('#report').textContent='';}},300)}document.querySelector('#load').onclick=load;load();
</script></html>
