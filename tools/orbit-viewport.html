<!doctype html><html lang="zh"><meta charset="utf-8"><title>太空普通模式验收</title>
<style>body{margin:0;background:#171717;color:#eee;font:13px system-ui}nav{padding:8px;display:flex;gap:10px;align-items:center}button,select{padding:5px}#box{position:relative;margin:8px auto}iframe{border:1px solid #555;transform-origin:top left}output{display:block;font:11px monospace;white-space:pre-wrap}</style>
<nav><label>屏幕 <select id="size"><option value="1280,720">桌面</option><option value="390,844">手机竖屏</option><option value="844,390">手机横屏</option></select></label><label>画面 <select id="fixture"><option value="air">空中航线</option><option value="risk">落点预警</option><option value="station">空间站</option><option value="comet">彗星</option><option value="rings">行星环</option></select></label><button id="load">显示画面</button><span id="state">加载中</span></nav>
<div id="box"><iframe title="太空普通模式"></iframe></div><output id="report"></output>
<script>
const frame=document.querySelector('iframe'),box=document.querySelector('#box');let poll,started=false;
const labels={air:'预览空中航线',risk:'预览落点预警',station:'预览空间站',comet:'预览彗星尘尾',rings:'预览行星环'};
function load(){clearInterval(poll);started=false;const[w,h]=document.querySelector('#size').value.split(',').map(Number),scale=Math.min(1,(innerWidth-24)/w,(innerHeight-65)/h);frame.width=w;frame.height=h;frame.style.transform=`scale(${scale})`;box.style.width=w*scale+'px';box.style.height=h*scale+'px';frame.src='/?orbitQA=1';document.querySelector('#state').textContent='加载中';poll=setInterval(()=>{const d=frame.contentDocument;if(!d)return;const resume=d.querySelector('#resume-run-no');if(resume&&resume.getClientRects().length)resume.click();const panel=d.querySelector('#orbit-qa');if(!panel)return;if(!started){const b=[...panel.querySelectorAll('button')].find(b=>b.textContent===labels[document.querySelector('#fixture').value]);if(b){started=true;b.click();}return;}const live=d.querySelector('#orbit-status');if(live&&!live.hidden&&live.getClientRects().length){panel.hidden=true;clearInterval(poll);const r=live.getBoundingClientRect();document.querySelector('#state').textContent='已显示';document.querySelector('#report').textContent=JSON.stringify({viewport:[w,h],strip:{x:r.x,y:r.y,width:r.width,height:r.height},inBounds:r.left>=0&&r.right<=w&&r.top>=0&&r.bottom<h/2});}},250)}document.querySelector('#load').onclick=load;load();
</script></html>
